    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Découvrez les offres exclusives Black Friday NOVA DEALS. Réductions massives sur la Tech, le Gaming, la Mode et la Maison. Quantités limitées." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get('theme');
          var theme = urlTheme || localStorage.getItem('nova-theme');
          if (urlTheme) {
            localStorage.setItem('nova-theme', urlTheme);
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
